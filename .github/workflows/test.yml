name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - name: Upload test report + dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dashboard
          path: |
            test-report.js
            test-dashboard.html
          if-no-files-found: warn
