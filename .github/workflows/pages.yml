# Publishes the test/science dashboard to GitHub Pages so the current state of
# main is readable without cloning and running the suite. The tests workflow
# stays the gate; this one only publishes.
#
# Deliberately NOT gated on the tests passing: a dashboard that disappears when
# the build goes red is useless precisely when it matters. The test step is
# allowed to fail, `npm test` writes test-report.js either way, and a red run
# publishes a red dashboard.
#
# Two things are published, side by side:
#
#   /       the dashboard
#   /app/   the PWA itself, so the app can be opened on a phone without a
#           checkout and a local static server
#
# The app lives under a subdirectory for one specific reason. A service worker's
# default scope is the directory its script is served from, and this one
# runtime-caches every same-origin GET it sees. Served from /app/sw.js it can
# only ever see /app/ requests, so the dashboard at the root stays outside its
# scope and never gets cached out from under a new deploy. Serving the app at
# the root instead would put the dashboard inside the worker's scope and pin it
# to whatever version was cached on the first visit.
#
# The app is relative-path clean throughout — the import map, the manifest's
# start_url/scope, and the worker's PRECACHE are all relative — so the
# subdirectory needs no build step and no rewriting.
#
# Requires Settings -> Pages -> Source: "GitHub Actions" to be enabled once.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; drop superseded runs but let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the report (a red suite still publishes)
        continue-on-error: true
        run: npm run coverage
      # Stages the dashboard at / and the app at /app/, and fails the build if
      # anything the worker precaches did not make it into the tree.
      - name: Stage the site
        run: node scripts/stage-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
