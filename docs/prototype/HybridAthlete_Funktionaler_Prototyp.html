/* ============================================================
   DRAG & DROP — Woche: halten, ziehen, fallen lassen (Touch + Maus)
   ============================================================ */
let drag=null, suppressTap=false;
function initWeekDnD(){
  const sec=document.getElementById("screen-week");
  sec.addEventListener("pointerdown",dndDown);
  sec.addEventListener("pointermove",dndMove,{passive:false});
  sec.addEventListener("pointerup",dndUp);
  sec.addEventListener("pointercancel",dndCancel);
}
function blockScroll(e){ if(drag&&drag.lifted) e.preventDefault(); }
function dndDown(e){
  const cell=e.target.closest(".slot[data-pid]"); if(!cell) return;
  drag={pid:cell.dataset.pid,cell,x:e.clientX,y:e.clientY,lifted:false,
    timer:setTimeout(liftDrag,280)};
}
function liftDrag(){
  if(!drag) return;
  drag.lifted=true;
  document.addEventListener("touchmove",blockScroll,{passive:false});
  const g=drag.cell.cloneNode(true);
  g.classList.add("drag-ghost");
  g.style.width=drag.cell.offsetWidth+"px";
  document.body.appendChild(g); drag.ghost=g;
  placeGhost(drag.x,drag.y);
  drag.cell.classList.add("drag-src");
}
function placeGhost(x,y){ drag.ghost.style.left=(x-drag.ghost.offsetWidth/2)+"px"; drag.ghost.style.top=(y-26)+"px"; }
function dndTarget(x,y){
  if(!drag.ghost) return null;
  drag.ghost.style.display="none";
  const el=document.elementFromPoint(x,y);
  drag.ghost.style.display="";
  const t=el&&el.closest(".slot[data-day]");
  return (t&&t!==drag.cell)?t:null;
}
function dndMove(e){
  if(!drag) return;
  if(!drag.lifted){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){ clearTimeout(drag.timer); drag=null; }
    return;
  }
  e.preventDefault();
  placeGhost(e.clientX,e.clientY);
  document.querySelectorAll(".drop-hint").forEach(x=>x.classList.remove("drop-hint"));
  const t=dndTarget(e.clientX,e.clientY);
  if(t) t.classList.add("drop-hint");
}
function dndUp(e){
  if(!drag) return;
  clearTimeout(drag.timer);
  if(!drag.lifted){ drag=null; return; } // normaler Tap -> onclick übernimmt
  const t=dndTarget(e.clientX,e.clientY);
  const pid=drag.pid;
  cleanupDrag();
  suppressTap=true; setTimeout(()=>{suppressTap=false;},260);
  if(!t){ render("week"); return; }
  moveSession(pid,+t.dataset.day,t.dataset.slot,t.dataset.pid||null);
}
function dndCancel(){ if(drag){ clearTimeout(drag.timer); cleanupDrag(); render("week"); } }
function cleanupDrag(){
  document.removeEventListener("touchmove",blockScroll);
  if(drag&&drag.ghost) drag.ghost.remove();
  document.querySelectorAll(".drag-src,.drop-hint").forEach(x=>x.classList.remove("drag-src","drop-hint"));
  drag=null;
}
function moveSession(pid,dayOff,slot,otherPid){
  const p=DB.planned.find(x=>x.id===pid); if(!p) return;
  const newDate=atHour(addDays(dOnly(NOW),dayOff),SLOT_HOUR[slot]).toISOString();
  let msg;
  if(otherPid&&otherPid!==pid){
    const o=DB.planned.find(x=>x.id===otherPid);
    if(!o||o.status==="logged"){ toast("Slot belegt – Ziel nicht verschiebbar","stop"); render("week"); return; }
    const pd=p.date, ps=p.slot;
    p.date=newDate; p.slot=slot;
    o.date=pd; o.slot=ps;
    msg=SPORTS[p.sportId].name+" ⇄ "+SPORTS[o.sportId].name+" getauscht";
  } else {
    p.date=newDate; p.slot=slot;
    msg=SPORTS[p.sportId].name+" → "+WD[new Date(newDate).getDay()]+" "+SLOT_LABEL[slot];
  }
  save(); recompute(); render("week"); render("home"); render("inbox");
  const n=DB.suggestions.length;
  toast(msg+(n?" · "+n+" Vorschlag"+(n===1?"":"e"):""));
}

/* ============================================================
   SESSION EDITOR — Tag/Slot/Fix manuell zuordnen (Woche)
   ============================================================ */
let editCtx=null;
const SLOT_HOUR={morning:8,midday:12,evening:18};
const SLOT_LABEL={morning:"morgens",midday:"mittags",evening:"abends"};
function openAdd(dayOff,slot){
  if(suppressTap) return;
  editCtx={mode:"add",dayOff:Math.max(0,Math.min(6,dayOff)),slot:slot||"evening",fixed:false,
    sportId:"strength",unit:null,exercises:null};
  seedAddStrength();
  renderEdit();
  const ov=document.getElementById("edit-overlay"); ov.classList.add("show"); ov.setAttribute("aria-hidden","false");
}
function seedAddStrength(){
  // Planungsphase: Generator wählt readiness-aware für den gewählten Termin
  const split=SPLITS[DB.profile.split]||SPLITS.PPL;
  const avail=split.units.filter(u=>!(DB.profile.disabledUnits||[]).includes(u));
  if(!editCtx.unit||!avail.includes(editCtx.unit)) editCtx.unit=avail[0]||split.units[0];
  const when=atHour(addDays(dOnly(NOW),editCtx.dayOff),SLOT_HOUR[editCtx.slot]);
  const gen=generateStrength(DB.profile,DB,when).find(u=>u.unit===editCtx.unit);
  editCtx.exercises=gen?gen.exercises.slice():[];
}
function setAddSport(id){
  editCtx.sportId=id;
  if(id==="strength") seedAddStrength(); else { editCtx.unit=null; editCtx.exercises=null; }
  renderEdit();
}
function setAddUnit(u){ editCtx.unit=u; seedAddStrength(); renderEdit(); }
function openEdit(id){
  if(suppressTap) return;
  const p=DB.planned.find(x=>x.id===id); if(!p||p.status==="logged") return;
  const dayOff=Math.round((dOnly(p.date)-dOnly(NOW))/864e5);
  editCtx={id,dayOff:Math.max(0,Math.min(6,dayOff)),slot:p.slot,fixed:!!p.fixed,
    exercises:p.exercises?p.exercises.slice():null};
  renderEdit();
  const ov=document.getElementById("edit-overlay"); ov.classList.add("show"); ov.setAttribute("aria-hidden","false");
}
function closeEdit(){ const ov=document.getElementById("edit-overlay"); ov.classList.remove("show"); ov.setAttribute("aria-hidden","true"); editCtx=null; }
function renderEdit(){
  const isAdd=editCtx.mode==="add";
  const p=isAdd?null:DB.planned.find(x=>x.id===editCtx.id);
  const sportId=isAdd?editCtx.sportId:p.sportId;
  const when=atHour(addDays(dOnly(NOW),editCtx.dayOff),SLOT_HOUR[editCtx.slot]);
  const days=[...Array(7)].map((_,i)=>{ const d=addDays(dOnly(NOW),i);
    return `<button class="opt ${editCtx.dayOff===i?"sel":""}" onclick="setEditDay(${i})">${i===0?"Heute":WD[d.getDay()]+" "+d.getDate()+"."}</button>`; }).join("");
  const slots=Object.keys(SLOT_HOUR).map(sl=>`<button class="opt ${editCtx.slot===sl?"sel":""}" onclick="setEditSlot('${sl}')">${SLOT_LABEL[sl]}</button>`).join("");
  let headCard, sportSection="";
  if(isAdd){
    const s=SPORTS[sportId];
    headCard=`<div class="session-card" style="margin-bottom:20px"><span class="sc-icon">${s.emoji}</span>
      <div><div class="sc-t">Neue Einheit</div><div class="sc-s">${WD[when.getDay()].toUpperCase()} ${when.getDate()}. · ${SLOT_LABEL[editCtx.slot].toUpperCase()}</div></div></div>`;
    sportSection=`<div class="field"><div class="f-lbl">Sport</div><div class="opt-row">
        ${Object.values(SPORTS).map(sp=>`<button class="opt ${sportId===sp.id?"sel":""}" onclick="setAddSport('${sp.id}')">${sp.emoji} ${sp.name}</button>`).join("")}
      </div></div>`;
    if(sportId==="strength"){
      const split=SPLITS[DB.profile.split]||SPLITS.PPL;
      const avail=split.units.filter(u=>!(DB.profile.disabledUnits||[]).includes(u));
      sportSection+=`<div class="field"><div class="f-lbl">Unit (${split.label})</div><div class="opt-row">
        ${avail.map(u=>`<button class="opt ${editCtx.unit===u?"sel":""}" onclick="setAddUnit('${u}')">${u}</button>`).join("")}
      </div></div>`;
    }
  } else {
    const s=SPORTS[p.sportId];
    headCard=`<div class="session-card" style="margin-bottom:20px"><span class="sc-icon">${s.emoji}</span>
      <div><div class="sc-t">${s.name}${p.unit?" · "+p.unit:""}</div>
      <div class="sc-s">${p.status==="removed"?"GESTRICHEN":wdShort(p.date).toUpperCase()+" · "+new Date(p.date).getHours()+":00"}</div></div></div>`;
  }
  let exSection="";
  if(sportId==="strength"&&editCtx.exercises){
    const rs=editCtx.exercises.map(id=>({id,r:exerciseReadiness(id,when,DB)}));
    const nOk=rs.filter(x=>x.r.level==="fresh").length;
    const dayLbl=editCtx.dayOff===0?"heute":WD[when.getDay()]+" "+when.getDate()+".";
    exSection=`<div class="field"><div class="f-lbl">Übungen · was geht ${dayLbl}? <span style="color:var(--text-low);text-transform:none;letter-spacing:0">(${nOk}/${rs.length} frei)</span></div>
      ${rs.map((x,i)=>{ const e=EX_BY_ID[x.id]; const lv=x.r.level;
        return `<div class="exr">
          <span class="mark m-${lv}" title="${FAT_LABELS[lv]||lv}"></span>
          <div class="exr-b"><div class="exr-n ${lv==="stop"?"blocked":""}">${e.name}</div>
            <div class="exr-r">${x.r.reasons.length?x.r.reasons.join(" · "):"frei – keine Einschränkung"}</div></div>
          ${lv!=="fresh"?`<button class="exr-btn" onclick="swapExEdit(${i})" title="Alternative suchen">⇄</button>`:""}
          <button class="exr-btn" onclick="dropExEdit(${i})" title="entfernen">✕</button>
        </div>`; }).join("")}
      <div class="c-add" style="margin-top:8px">
        <select id="add-ex" class="csel" style="flex:1">${addableExercises({unit:editCtx.unit||(p&&p.unit)},when).map(e=>`<option value="${e.id}">${e.mark} ${e.name}</option>`).join("")}</select>
        <button class="opt" onclick="addExEdit()">＋</button>
      </div>
      <p class="subtle" style="font-size:12px;margin-top:8px">Machbarkeit gilt für den gewählten Tag – wechsle den Tag und schau, wie sich die Ampeln ändern (z. B. wenn das Bergtag-Fenster abläuft).</p>
    </div>`;
  }
  document.getElementById("edit-save").textContent=isAdd?"Zur Woche hinzufügen":"Speichern";
  document.getElementById("edit-body").innerHTML=`
    ${headCard}
    ${sportSection}
    <div class="field"><div class="f-lbl">Tag</div><div class="opt-row">${days}</div></div>
    <div class="field"><div class="f-lbl">Slot</div><div class="opt-row">${slots}</div></div>
    ${exSection}
    <div class="toggle-row"><div class="tr-body"><div class="tr-t">📌 Fixe Einheit</div><div class="tr-s">Fix = die Engine schlägt höchstens Abschwächen oder Anpassen vor, nie Verschieben oder Streichen.</div></div>
      <div class="switch ${editCtx.fixed?"on":""}" onclick="toggleEditFix(this)" role="switch" aria-checked="${editCtx.fixed}" tabindex="0"><span class="knob"></span></div></div>
    ${isAdd?"":`<button class="alt-choice" style="width:100%;margin-top:14px" onclick="toggleRemovePlanned()">${p.status==="removed"?"Wiederherstellen":"Einheit streichen"}</button>`}`;
}
function setEditDay(i){ editCtx.dayOff=i; if(editCtx.mode==="add"&&editCtx.sportId==="strength") seedAddStrength(); renderEdit(); }
function setEditSlot(sl){ editCtx.slot=sl; if(editCtx.mode==="add"&&editCtx.sportId==="strength") seedAddStrength(); renderEdit(); }
function addableExercises(ctx,when){
  const cats=UNIT_CATS[ctx.unit]||[ctx.unit];
  return EXERCISES.filter(e=>cats.includes(e.cat)&&!editCtx.exercises.includes(e.id)&&passesConstraints(e,DB.profile))
    .map(e=>{ const r=exerciseReadiness(e.id,when,DB); return {id:e.id,name:e.name,lv:r.level,
      mark:r.level==="fresh"?"●":r.level==="caution"?"◆":"■"}; })
    .sort((a,b)=>READY_RANK[a.lv]-READY_RANK[b.lv]);
}
function swapExEdit(i){
  const unit=editCtx.mode==="add"?editCtx.unit:(DB.planned.find(x=>x.id===editCtx.id)||{}).unit;
  const when=atHour(addDays(dOnly(NOW),editCtx.dayOff),SLOT_HOUR[editCtx.slot]);
  const orig=EX_BY_ID[editCtx.exercises[i]];
  const cats=UNIT_CATS[unit]||[unit];
  const ok=e=>!editCtx.exercises.includes(e.id)&&passesConstraints(e,DB.profile)&&exerciseReadiness(e.id,when,DB).level==="fresh";
  const cand=EXERCISES.find(e=>e.cat===orig.cat&&ok(e))||EXERCISES.find(e=>cats.includes(e.cat)&&ok(e));
  if(!cand){ toast("Keine freie Alternative gefunden","stop"); return; }
  editCtx.exercises[i]=cand.id; renderEdit();
  toast(orig.name+" → "+cand.name);
}
function dropExEdit(i){ editCtx.exercises.splice(i,1); renderEdit(); }
function addExEdit(){
  const sel=document.getElementById("add-ex"); if(!sel||!sel.value) return;
  editCtx.exercises.push(sel.value); renderEdit();
}
function toggleEditFix(el){ editCtx.fixed=!editCtx.fixed; renderEdit(); }
function toggleRemovePlanned(){
  const p=DB.planned.find(x=>x.id===editCtx.id);
  p.status=p.status==="removed"?"planned":"removed";
  save(); recompute(); render("week"); render("home"); render("inbox"); closeEdit();
  toast(p.status==="removed"?"Einheit gestrichen":"Einheit wiederhergestellt");
}
function saveEdit(){
  const when=atHour(addDays(dOnly(NOW),editCtx.dayOff),SLOT_HOUR[editCtx.slot]);
  if(editCtx.mode==="add"){
    const extra=editCtx.sportId==="strength"?{unit:editCtx.unit,exercises:(editCtx.exercises||[]).slice()}:{};
    if(editCtx.sportId==="strength"&&!extra.exercises.length){ toast("Mindestens eine Übung wählen","stop"); return; }
    DB.planned.push(mkPlanned(editCtx.sportId,when,editCtx.slot,editCtx.fixed,extra));
    save(); recompute(); render("week"); render("home"); render("inbox"); closeEdit(); go("week");
    const n=DB.suggestions.length;
    toast("Einheit geplant · "+(n?n+" Vorschlag"+(n===1?"":"e")+" – Coach hat die Woche geprüft":"keine Konflikte"));
    return;
  }
  const p=DB.planned.find(x=>x.id===editCtx.id);
  p.date=when.toISOString();
  p.slot=editCtx.slot; p.fixed=editCtx.fixed;
  if(editCtx.exercises&&p.exercises&&editCtx.exercises.join()!==p.exercises.join()){
    p.exercises=editCtx.exercises.slice(); p.adjusted=true;
  }
  save(); recompute(); render("week"); render("home"); render("inbox"); closeEdit();
  const n=DB.suggestions.length;
  toast("Gespeichert · "+(n?n+" Vorschlag"+(n===1?"":"e")+" – Coach hat die Woche geprüft":"keine Konflikte"));
}

/* ============================================================
   MORNING CHECK-IN
   ============================================================ */
let checkinState={};
function openCheckin(){
  checkinState={};
  const regions=recentlyLoadedRegions();
  const body=document.getElementById("checkin-body");
  body.innerHTML=`<div class="step"><div class="s-k">Guten Morgen</div><h2>Wie fühlst du dich?</h2>
    <p class="s-hint">Nur Regionen mit Last aus den letzten 72 h. Ein Tap pro Region.</p>
    ${regions.length?regions.map(r=>{ checkinState[r]="fresh"; return `<div class="region-block"><div class="rb-name">${REGION_LABELS[r]}</div><div class="segmented">${
      ["fresh","caution","stop"].map(v=>`<div class="seg ${v==="fresh"?"sel v-fresh":""}" onclick="selCheckin('${r}','${v}',this)"><span class="seg-mark m-${v}"></span><span class="seg-lbl">${FAT_LABELS[v]}</span></div>`).join("")
    }</div></div>`; }).join(""):`<div class="subtle">Keine relevante Last in den letzten 72 h – alles frisch.</div>`}`;
  const ov=document.getElementById("checkin-overlay"); ov.classList.add("show"); ov.setAttribute("aria-hidden","false");
}
function recentlyLoadedRegions(){
  const set=new Set();
  DB.logs.forEach(l=>{ if(hoursBetween(l.date,NOW)<=72){ Object.keys(regionLoad(l)).forEach(r=>{ if(r!=="systemic"&&r!=="knee") set.add(r); }); } });
  return [...set].slice(0,6);
}
function selCheckin(r,v,el){ checkinState[r]=v; const seg=el.closest(".segmented"); seg.querySelectorAll(".seg").forEach(s=>s.className="seg"); el.className="seg sel v-"+v; }
function closeCheckin(){ const ov=document.getElementById("checkin-overlay"); ov.classList.remove("show"); ov.setAttribute("aria-hidden","true"); }
function saveCheckin(){
  Object.entries(checkinState).forEach(([r,lvl])=>{ DB.fatigue.push({id:uid(),region:r,level:lvl,ts:new Date().toISOString(),context:"morning_checkin"}); });
  save(); closeCheckin(); recompute(); go("inbox");
  const n=DB.suggestions.length;
  setTimeout(()=>toast("Check-in gespeichert · "+(n?n+" Vorschläge":"keine neuen Vorschläge")),350);
}

let toastTimer;
function toast(text,kind){
  const t=document.getElementById("toast");
  document.getElementById("toast-text").innerHTML=text;
  document.getElementById("toast-icon").textContent=kind==="stop"?"✕":"✓";
  document.getElementById("toast-icon").style.background=kind==="stop"?"var(--stop-dim)":"var(--fresh-dim)";
  t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}
(function initClock(){ const c=document.getElementById("clock"); function u(){ const d=new Date(); c.textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); } u(); setInterval(u,30000); })();
